apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudo-system-api
  labels:
    app.kubernetes.io/name: sudo-system-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sudo-system-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sudo-system-api
    spec:
      containers:
        - name: go-server
          image: sudo-system:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: sudo-system-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
